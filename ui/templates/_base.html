<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}NFL Elo{% endblock %}</title>
  <link rel="stylesheet" href="{{ base_path }}static/css/app.css" />
</head>
<body class="broadcast-shell">
  <div class="site-backdrop" aria-hidden="true">
    <div class="site-glow site-glow-a"></div>
    <div class="site-glow site-glow-b"></div>
    <div class="site-grid"></div>
  </div>

  <div class="site-frame">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">
          {% if active_page == "home" %}
            NFL Power Index
          {% elif active_page == "leaderboard" %}
            NFL Power Index
          {% else %}
            <a href="{{ base_path }}index.html" class="brandlink">NFL Power Index</a>
          {% endif %}
        </div>
        <div class="brand-subtitle">2024 NFL SEASON</div>
      </div>

      <nav class="nav" aria-label="Primary">
        <a href="{{ base_path }}index.html" class="navlink {% if active_page == 'home' %}active{% endif %}">Home</a>
        <a href="{{ base_path }}leaderboard/week-18.html" class="navlink {% if active_page == 'leaderboard' %}active{% endif %}">Leaderboard</a>
        <a href="{{ base_path }}matchup.html" class="navlink {% if active_page == 'matchup' %}active{% endif %}">Matchup</a>
        <a href="{{ base_path }}teams/index.html" class="navlink {% if active_page == 'teams' %}active{% endif %}">Teams</a>
        <a href="{{ base_path }}about.html" class="navlink {% if active_page == 'about' %}active{% endif %}">About</a>
        <a href="{{ base_path }}contact.html" class="navlink {% if active_page == 'contact' %}active{% endif %}">Contact</a>
      </nav>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="footer-links">
        <a class="footerlink" href="{{ base_path }}about.html">About</a>
        <a class="footerlink" href="{{ base_path }}contact.html">Contact</a>
        <a class="footerlink" href="https://github.com/charles633-wcu" target="_blank" rel="noopener">GitHub</a>
      </div>
    </footer>
  </div>
  {% if page_name == "home" %}
    <script defer src="{{ base_path }}static/js/homepage.js"></script>
  {% endif %}
</body>
</html>
